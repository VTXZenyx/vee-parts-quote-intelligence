name: Workspace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check vee tests evaluation scripts
      - run: mypy --check-untyped-defs vee evaluation
      - run: python -m unittest discover -v
      - run: python -m evaluation.run
      - run: python -m evaluation.enquiries
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.browser_smoke
